# CinePulse AI - used when running `streamlit run frontend/app.py` directly.
[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0B0B14"
secondaryBackgroundColor = "#14142A"
textColor = "#ECEEF8"

[client]
toolbarMode = "minimal"

[server]
# Largest video that can be uploaded in the browser, in MB (500 or 1024). The packaged exe / launcher.py overrides this
# with --server.maxUploadSize from the sidebar choice. Uploads are streamed to disk in 4 MB chunks.
maxUploadSize = 1024

[browser]
gatherUsageStats = false
