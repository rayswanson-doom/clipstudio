name: Build Windows exe

# Run it by hand: Actions tab -> "Build Windows exe" -> Run workflow.
# It builds on a free GitHub Windows machine, starts the finished exe to prove it
# boots, and publishes CinePulseAI-Final-Executable.zip as a downloadable artifact.
on:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the zip as a (private) release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Optional. Repository secret holding the full text of your token.json.
      # Leave the secret unset to build WITHOUT Google sign-in bundled (safer).
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Write token.json from secret (optional)
        if: ${{ env.GOOGLE_TOKEN_JSON != '' }}
        shell: python
        run: |
          import os
          open("token.json", "w", encoding="utf-8").write(os.environ["GOOGLE_TOKEN_JSON"])

      - name: Build (downloads ffmpeg + models automatically)
        run: python build_exe.py --ci --no-zip

      - name: Self-test the packaged exe (imports, ffmpeg, face model, Whisper, a real clip, the app page)
        shell: pwsh
        run: |
          $st = Join-Path $env:RUNNER_TEMP "selftest"
          Copy-Item dist\CinePulseAI $st -Recurse
          $p = Start-Process -FilePath "$st\CinePulseAI.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$st\cinepulseai.log") { Get-Content "$st\cinepulseai.log" }
          if ($p.ExitCode -ne 0) { throw "CinePulseAI.exe --selftest failed (exit code $($p.ExitCode))" }

      - name: Smoke test - the exe must start and answer its health check
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          Copy-Item dist\CinePulseAI $smoke -Recurse
          $proc = Start-Process -FilePath "$smoke\CinePulseAI.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8501/_stcore/health" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (Test-Path "$smoke\cinepulseai.log") { Get-Content "$smoke\cinepulseai.log" -Tail 60 }
          Get-Process -Name CinePulseAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "CinePulseAI.exe did not start within 4 minutes" }
          Write-Host "Smoke test passed: the exe started and the app answered."

      - name: Make the zip
        run: python -c "import build_exe, pathlib; print(build_exe.make_zip(pathlib.Path('dist/CinePulseAI'), pathlib.Path('dist/CinePulseAI-Final-Executable.zip')))"

      - uses: actions/upload-artifact@v4
        with:
          name: CinePulseAI-Final-Executable
          path: dist/CinePulseAI-Final-Executable.zip
          retention-days: 14
          compression-level: 0

      - name: Publish the zip as a release (one-click download, no double unzip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "dist/CinePulseAI-Final-Executable.zip" --repo $env:GITHUB_REPOSITORY --title "CinePulse AI build $env:GITHUB_RUN_NUMBER" --notes "Windows build. Download the zip, unzip it, double-click CinePulseAI.exe inside the CinePulseAI folder."
