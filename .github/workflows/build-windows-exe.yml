name: Build Windows exe

# Run it by hand: Actions tab -> "Build Windows exe" -> Run workflow.
# It builds on a free GitHub Windows machine, starts the finished exe to prove it
# boots, and publishes CinePulseAI-Portable.zip (validated, then unzipped and tested exactly as a user would use it).
on:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the zip as a (private) release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Optional. Repository secret holding the full text of your token.json.
      # Leave the secret unset to build WITHOUT Google sign-in bundled (safer).
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Write token.json from secret (optional)
        if: ${{ env.GOOGLE_TOKEN_JSON != '' }}
        shell: python
        run: |
          import os
          open("token.json", "w", encoding="utf-8").write(os.environ["GOOGLE_TOKEN_JSON"])

      - name: Build the app and the final zip (downloads ffmpeg + models, then validates the zip)
        run: python build_exe.py --ci

      - name: Unzip the FINAL zip into a clean folder (this is what the user receives)
        shell: pwsh
        run: |
          python build_exe.py --validate-zip dist\CinePulseAI-Portable.zip
          $pkg = Join-Path $env:RUNNER_TEMP "pkg"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          tar -xf dist\CinePulseAI-Portable.zip -C $pkg
          if (-not (Test-Path "$pkg\CinePulseAI\CinePulseAI.exe")) { throw "CinePulseAI.exe missing after unzip" }
          Get-ChildItem "$pkg\CinePulseAI" | Select-Object Name | Format-Table -HideTableHeaders

      - name: Self-test the unzipped app (imports, ffmpeg, face model, Whisper, a real clip, an avatar video, the app page)
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "pkg\CinePulseAI"
          $p = Start-Process -FilePath "$app\CinePulseAI.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$app\cinepulseai.log") { Get-Content "$app\cinepulseai.log" }
          if ($p.ExitCode -ne 0) { throw "CinePulseAI.exe --selftest failed (exit code $($p.ExitCode))" }

      - name: Smoke test - the unzipped exe must start and answer its health check
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "pkg\CinePulseAI"
          $proc = Start-Process -FilePath "$app\CinePulseAI.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8501/_stcore/health" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (Test-Path "$app\cinepulseai.log") { Get-Content "$app\cinepulseai.log" -Tail 60 }
          Get-Process -Name CinePulseAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "CinePulseAI.exe did not start within 4 minutes" }
          Write-Host "Smoke test passed: the exe started and the app answered."

      - uses: actions/upload-artifact@v4
        with:
          name: CinePulseAI-Portable
          path: dist/CinePulseAI-Portable.zip
          retention-days: 14
          compression-level: 0

      - name: Publish the zip as a release (one-click download, no double unzip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "dist/CinePulseAI-Portable.zip" --repo $env:GITHUB_REPOSITORY --title "CinePulse AI build $env:GITHUB_RUN_NUMBER" --notes "Windows build. Download CinePulseAI-Portable.zip, unzip it, double-click CinePulseAI.exe inside the CinePulseAI folder. No installation and no internet needed for the core features."
